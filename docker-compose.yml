services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: finstream
      POSTGRES_USER: finstream
      POSTGRES_PASSWORD: finstream
    ports:
      - "5432:5432"
    volumes:
      - finstream-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finstream -d finstream"]
      interval: 5s
      timeout: 3s
      retries: 10

  finstream:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finstream
      DB_USER: finstream
      DB_PASSWORD: finstream
      BINANCE_ENABLED: ${BINANCE_ENABLED:-false}
      BINANCE_FUNDING_ENABLED: ${BINANCE_FUNDING_ENABLED:-false}
      BINANCE_FUNDING_POLL_INTERVAL: ${BINANCE_FUNDING_POLL_INTERVAL:-60s}
      BINANCE_OPEN_INTEREST_ENABLED: ${BINANCE_OPEN_INTEREST_ENABLED:-false}
      BINANCE_OPEN_INTEREST_POLL_INTERVAL: ${BINANCE_OPEN_INTEREST_POLL_INTERVAL:-30s}
      FUNDING_EXTREME_ENABLED: ${FUNDING_EXTREME_ENABLED:-true}
      FUNDING_EXTREME_THRESHOLD: ${FUNDING_EXTREME_THRESHOLD:-0.001}
      OPEN_INTEREST_SURGE_ENABLED: ${OPEN_INTEREST_SURGE_ENABLED:-true}
      OPEN_INTEREST_SURGE_THRESHOLD_PERCENT: ${OPEN_INTEREST_SURGE_THRESHOLD_PERCENT:-5.0}
    ports:
      - "8080:8080"

volumes:
  finstream-postgres:
